<header class="sticky top-0 z-50 border-b border-stone-200/60 bg-stone-50/80 backdrop-blur-md">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4 lg:px-8">
            <a href="#" class="text-base font-medium tracking-tighter text-stone-900">SAGERHOUSE</a>

            <!-- Mobile menu button -->
            <button id="mobile-menu-button" type="button" class="md:hidden -mr-2 inline-flex items-center justify-center rounded-md p-2 text-stone-600 hover:bg-stone-100 focus:outline-none focus:ring-2 focus:ring-stone-900" aria-controls="mobile-menu" aria-expanded="false">
                <span class="sr-only">Open main menu</span>
                <iconify-icon id="mobile-menu-icon" icon="solar:menu-list-linear" class="text-2xl"></iconify-icon>
            </button>

            <nav class="hidden md:flex items-center gap-x-8 text-sm font-normal">
                <a href="#apartments" class="text-stone-700 hover:text-stone-900 transition-colors" data-i18n="header.apartments">Apartments</a>
                <a href="#prices" class="text-stone-700 hover:text-stone-900 transition-colors" data-i18n="header.prices">Prices</a>
                <a href="#availability" class="text-stone-700 hover:text-stone-900 transition-colors" data-i18n="header.availability">Availability</a>
                <a href="#gallery" class="text-stone-700 hover:text-stone-900 transition-colors" data-i18n="header.gallery">Gallery</a>
                <a href="#location" class="text-stone-700 hover:text-stone-900 transition-colors" data-i18n="header.location">Location</a>
                <a href="#faq" class="text-stone-700 hover:text-stone-900 transition-colors" data-i18n="header.faq">FAQ</a>
                <a href="#contact" class="text-stone-700 hover:text-stone-900 transition-colors" data-i18n="header.contact">Contact</a>
            </nav>

            <div class="flex items-center gap-x-6">
                <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle dark theme" title="Toggle dark theme">
                    <iconify-icon data-theme-icon icon="solar:moon-linear"></iconify-icon>
                </button>
                <div class="hidden sm:block">
                    <label for="desktop-language-select" class="sr-only">Choose language</label>
                    <select id="desktop-language-select" class="lang-select" data-lang-select aria-label="Choose language">
                        <option value="en">EN</option>
                        <option value="de">DE</option>
                        <option value="uk">UK</option>
                        <option value="ru">RU</option>
                        <option value="sk">SK</option>
                        <option value="cs">CS</option>
                        <option value="hu">HU</option>
                    </select>
                </div>
                <a href="#contact" class="rounded-md bg-stone-900 px-4 py-2 text-sm font-medium text-stone-50 shadow-sm hover:bg-stone-800 transition-colors" data-i18n="header.book-now">Book Now</a>
            </div>
        </div>

        <!-- Mobile navigation panel -->
        <div id="mobile-menu" class="md:hidden hidden border-t border-stone-200 bg-white">
            <div class="px-6 py-5">
                <nav class="flex flex-col gap-2 text-sm font-medium text-stone-700">
                    <a href="#apartments" class="rounded-md px-3 py-2 hover:bg-stone-100" data-i18n="header.apartments">Apartments</a>
                    <a href="#prices" class="rounded-md px-3 py-2 hover:bg-stone-100" data-i18n="header.prices">Prices</a>
                    <a href="#availability" class="rounded-md px-3 py-2 hover:bg-stone-100" data-i18n="header.availability">Availability</a>
                    <a href="#gallery" class="rounded-md px-3 py-2 hover:bg-stone-100" data-i18n="header.gallery">Gallery</a>
                    <a href="#location" class="rounded-md px-3 py-2 hover:bg-stone-100" data-i18n="header.location">Location</a>
                    <a href="#faq" class="rounded-md px-3 py-2 hover:bg-stone-100" data-i18n="header.faq">FAQ</a>
                    <a href="#contact" class="rounded-md px-3 py-2 hover:bg-stone-100" data-i18n="header.contact">Contact</a>
                </nav>

                <div class="mt-5 flex flex-col gap-3 border-t border-stone-200 pt-5">
                    <button type="button" class="theme-toggle theme-toggle-mobile" data-theme-toggle aria-label="Toggle dark theme" title="Toggle dark theme">
                        <iconify-icon data-theme-icon icon="solar:moon-linear"></iconify-icon>
                    </button>
                    <div>
                        <label for="mobile-language-select" class="sr-only">Choose language</label>
                        <select id="mobile-language-select" class="lang-select lang-select-mobile" data-lang-select aria-label="Choose language">
                            <option value="en">EN</option>
                            <option value="de">DE</option>
                            <option value="uk">UK</option>
                            <option value="ru">RU</option>
                            <option value="sk">SK</option>
                            <option value="cs">CS</option>
                            <option value="hu">HU</option>
                        </select>
                    </div>
                    <a href="#contact" class="block rounded-md bg-stone-900 px-4 py-2 text-center text-sm font-medium text-stone-50 hover:bg-stone-800 transition-colors" data-i18n="header.book-now">Book Now</a>
                </div>
            </div>
        </div>
    </header>
